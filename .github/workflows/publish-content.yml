name: Pubblica i casi approvati

# Avvio a mano dalla pagina Actions ("Run workflow"): prende le bozze approvate nell'editor,
# le scrive in content/ e apre una Pull Request. Unita la PR, il sito si aggiorna (ci.yml)
# e il job "segna" mette le bozze in stato "pubblicato".
#
# Serve il secret SUPABASE_SECRET_KEY (Settings → Secrets and variables → Actions → Secrets)
# e il permesso "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/published-drafts.json']

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  esporta:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Esporta le bozze approvate
        id: export
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node scripts/export-approved.mjs
          # anche i file nuovi (casi nuovi) contano come cambiamenti
          if [ -z "$(git status --porcelain -- content)" ]; then echo "changes=false" >> "$GITHUB_OUTPUT"; else echo "changes=true" >> "$GITHUB_OUTPUT"; fi
      - name: Resoconto se bloccata
        if: failure()
        run: test -f publish-report.md && cat publish-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Controlli completi
        if: steps.export.outputs.changes == 'true'
        run: npm run check
      - name: Apri la Pull Request
        if: steps.export.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="contenuti/$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content
          git commit -m "Contenuti: casi approvati nell'editor" -m "$(cat publish-report.md)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Contenuti: casi approvati nell'editor" --body-file publish-report.md
          cat publish-report.md >> "$GITHUB_STEP_SUMMARY"

  segna:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Segna le bozze come pubblicate
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/mark-published.mjs
